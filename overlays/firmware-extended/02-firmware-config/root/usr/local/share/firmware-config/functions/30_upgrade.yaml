upgrade_url:
  title: Firmware Upgrade (URL)
  shell: |
    # Validate URL
    case "$1" in
      *github.com*/artifacts/*)
        echo "ERROR: GitHub Actions artifact URLs require authentication."
        echo "Please download the artifact manually."
        exit 1
        ;;
    esac

    echo "Downloading upgrade..."
    if ! /usr/local/bin/curl -L -f -o /userdata/url_upgrade.bin "$1"; then
      echo "Failed to download upgrade file."
      exit 1
    fi

    if ! /usr/local/bin/firmware-upgrade-prepare.sh /userdata/url_upgrade.bin; then
      echo "ERROR: Firmware preflight failed; the upgrade was not started."
      rm -f /userdata/url_upgrade.bin
      exit 1
    fi

    size=$(stat -c%s /userdata/url_upgrade.bin 2>/dev/null || wc -c < /userdata/url_upgrade.bin)
    echo "Starting upgrade ($(($size / 1024 / 1024)) MB)..."
    /home/lava/bin/systemUpgrade.sh upgrade all /userdata/url_upgrade.bin
  stop_token: "upgrade soc finish, prepare to reboot"

upgrade_upload:
  title: Firmware Upgrade (Upload)
  upload_path: /userdata/web_upgrade.bin
  shell: |
    if ! /usr/local/bin/firmware-upgrade-prepare.sh "$1"; then
      echo "ERROR: Firmware preflight failed; the upgrade was not started."
      rm -f "$1"
      exit 1
    fi

    size=$(stat -c%s "$1" 2>/dev/null || wc -c < "$1")
    echo "Starting upgrade ($(($size / 1024 / 1024)) MB)..."
    /home/lava/bin/systemUpgrade.sh upgrade all "$1"
  stop_token: "upgrade soc finish, prepare to reboot"
